name: CI

on:
  push:
    branches: [master]
  # Sin filtro de rama: también corre en PRs apilados sobre ramas feature.
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Un push nuevo a la misma rama cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.14"

# Cada comando vive en el Makefile, para que en local dé el mismo resultado
# (tests/test_ci.py lo verifica). Los criterios de rechazo de cada control
# están en docs/matriz-controles.md.
jobs:
  lint:
    name: Lint (Ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: make instalar

      - run: make lint
        env:
          # Anota cada hallazgo en la línea del PR.
          RUFF_OUTPUT_FORMAT: github

  seguridad:
    name: Seguridad (Bandit, pip-audit y npm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: make instalar

      - run: make seguridad

      - name: Guardar los reportes
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: seguridad
          path: reportes/

  secretos:
    name: Secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Historial completo: un secreto en un commit viejo sigue expuesto.
          fetch-depth: 0

      - run: make secretos

      - name: Guardar el reporte
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: secretos
          path: reportes/gitleaks.json

  documentacion:
    name: Documentación (Sphinx y enlaces)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: make instalar

      - name: Construir el sitio y revisar el Markdown
        run: make docs

      - name: Guardar el sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

      # Informa sin bloquear: la caída de un sitio ajeno no debe frenar un cambio.
      - name: Revisar los enlaces externos
        continue-on-error: true
        run: make enlaces

      - name: Guardar el informe de enlaces
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: enlaces
          path: docs/_build/linkcheck/output.txt

  tests:
    name: Tests, cobertura y Performance Gate
    needs: [lint, seguridad, secretos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Historial completo: Sonar lo usa para detectar el código nuevo.
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - run: make instalar

      # El umbral (fail_under = 80) está en pyproject.toml.
      - name: Tests y cobertura (>= 80%)
        run: make tests

      # También cuando fallan los tests, que es cuando más se necesita.
      - name: Guardar el reporte de cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cobertura
          path: |
            coverage.xml
            htmlcov/

      # Lee sonar-project.properties y el coverage.xml del paso anterior.
      # Falla si cae el quality gate (sonar.qualitygate.wait).
      # Los PR de Dependabot no reciben SONAR_TOKEN y no tocan el código que analiza.
      - name: SonarCloud
        if: github.event.pull_request.user.login != 'dependabot[bot]'
        uses: SonarSource/sonarqube-scan-action@v8
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      # Paso separado y sin cobertura: el tracing distorsiona los tiempos.
      - name: Performance Gate
        run: make rendimiento

  # Único check obligatorio para integrar en master: así la protección de
  # rama no se rompe al agregar o renombrar jobs. Todo job nuevo se suma a
  # `needs`. Sin always() quedaría omitido si falla un job, y la protección
  # toma un check omitido como aprobado.
  resultado-final:
    name: Resultado final
    needs: [lint, seguridad, secretos, documentacion, tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - run: make resultado-final
        env:
          RESULTADOS: ${{ toJSON(needs) }}

  # Solo cuando el cambio ya se integró y "Resultado final" aprobó.
  publicar-docs:
    name: Publicar la documentación
    needs: [resultado-final]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - id: despliegue
        uses: actions/deploy-pages@v5
