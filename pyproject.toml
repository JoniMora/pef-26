# Configuración de las herramientas de calidad que corre el pipeline
# (.github/workflows/ci.yml). No empaqueta el proyecto: los scripts de
# src/ se siguen ejecutando directamente con `python3 src/<script>.py`.

# ─────────────────────────────────────────────────────────────
#  Ruff (linter)
# ─────────────────────────────────────────────────────────────
[tool.ruff]
# Versión mínima soportada (README: Python 3.11+), no la del CI: el
# formateador solo usa sintaxis que esa versión entiende.
target-version = "py311"
line-length = 88
# Los módulos de src/ se importan entre sí como top-level
# (`from optimizado import ...`): se declaran como first-party.
src = ["src", "tests"]
extend-exclude = ["presentacion", "profiles"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint]
select = ["E", "W", "F", "N", "D", "C901"]
# Reglas que chocan con `ruff format` (el formateador ya decide la
# indentación y las comillas de los docstrings).
ignore = ["W191", "E111", "E114", "E117", "D206", "D300"]

[tool.ruff.lint.mccabe]
# Complejidad ciclomática máxima por función.
max-complexity = 10

[tool.ruff.lint.pydocstyle]
# pep257 desactiva por sí sola las reglas de docstrings que se
# contradicen entre sí (D203 frente a D211, D212 frente a D213).
convention = "pep257"

[tool.ruff.lint.per-file-ignores]
# Los tests y benchmarks se documentan con su nombre: no se les exige docstring.
"tests/**" = ["D"]
"benchmarks/**" = ["D"]

[tool.ruff.lint.isort]
combine-as-imports = true
lines-after-imports = 2

# ─────────────────────────────────────────────────────────────
#  mypy (tipado estático)
# ─────────────────────────────────────────────────────────────
[tool.mypy]
# Se exige en el motor y la API. Los demás módulos se leen para conocer sus
# tipos, pero sus errores no se informan.
files = ["src/core", "src/optimizado.py", "src/api.py"]
follow_imports = "silent"
disallow_untyped_defs = true
warn_unused_ignores = true
# Igual que en Ruff, la versión mínima soportada.
python_version = "3.11"
# Los módulos de src/ se importan como top-level.
mypy_path = "src"
explicit_package_bases = true

# ─────────────────────────────────────────────────────────────
#  Bandit (análisis de seguridad)
# ─────────────────────────────────────────────────────────────
[tool.bandit]
exclude_dirs = ["tests", "benchmarks", ".venv", "profiles", "node_modules", ".herramientas", "reportes"]

# ─────────────────────────────────────────────────────────────
#  Pytest
# ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
# Equivale a ejecutar desde src/: los tests importan `baseline` y
# `optimizado` igual que lo hacen los propios scripts.
pythonpath = ["src"]
addopts = "-ra --strict-markers"
markers = [
    "rendimiento: Performance Gate; se corre aparte y sin cobertura para no medir el overhead del tracing",
]

# ─────────────────────────────────────────────────────────────
#  Coverage
# ─────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["src"]
# perfilado.py es el arnés de medición (lanza subprocesos y Scalene, y
# genera gráficos), no parte del motor de búsqueda.
omit = ["src/perfilado.py"]

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = false
exclude_also = [
    'if __name__ == "__main__":',
]
