# Proyecto en SonarCloud (Administration -> Information).
sonar.organization=jonimora
sonar.projectKey=JoniMora_pef-26

sonar.sources=src
sonar.tests=tests
sonar.sourceEncoding=UTF-8
sonar.python.version=3.11, 3.12, 3.13, 3.14

# perfilado.py se analiza como el resto del código, pero queda fuera de la
# cobertura: es el arnés de medición (lanza subprocesos, Scalene y py-spy)
# y pytest-cov tampoco lo mide (ver [tool.coverage.run] en pyproject.toml).
sonar.coverage.exclusions=src/perfilado.py

# Generado por pytest-cov en el job de tests (--cov-report=xml).
sonar.python.coverage.reportPaths=coverage.xml
